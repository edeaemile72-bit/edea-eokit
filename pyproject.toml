[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "eokit"
version = "1.0.3"
description = "Tested and reproducible Python chain for surface water and flood mapping from optical satellite imagery"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "EDEA Obognon Emile", email = "edeaemile72@gmail.com" },
  { name = "PLAGBETO Hermann Arnaud" },
  { name = "OLOUKOI Joseph" },
]
keywords = [
  "remote sensing",
  "surface water",
  "flood mapping",
  "Sentinel-2",
  "Landsat",
  "spatial cross-validation",
  "reproducibility",
  "geomatics",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
  "numpy>=1.24",
  "rasterio>=1.3",
  "geopandas>=0.14",
  "shapely>=2.0",
  "pyproj>=3.5",
  "scikit-image>=0.21",
  "scikit-learn>=1.3",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
notebook = ["jupyterlab>=4.0", "nbconvert>=7.0"]

[project.urls]
Homepage = "https://github.com/edeaemile72-bit/edea-eokit"
Repository = "https://github.com/edeaemile72-bit/edea-eokit"
Issues = "https://github.com/edeaemile72-bit/edea-eokit/issues"

[tool.setuptools]
packages = ["eokit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-q"
